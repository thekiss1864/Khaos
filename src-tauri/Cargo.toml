[package]
name = "khaos-tauri-app"
version = "0.1.0"
description = "Khaos - League of Legends client toolkit"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "system-tray", "window-show", "window-unmaximize", "window-hide", "protocol-asset", "fs-copy-file", "app-show", "app-hide", "fs-remove-dir", "window-close", "process-relaunch", "window-minimize", "window-start-dragging", "window-maximize", "fs-rename-file", "path-all", "fs-remove-file", "shell-open", "fs-read-file", "fs-write-file", "fs-read-dir", "fs-create-dir", "dialog-open", "dialog-save"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
base64 = "0.21"
lazy_static = "1.4"
# Finds the running League client process (port/token/install path)
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
# Registry lookup for the League install path
winreg = "0.55"

[features]
# This feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

